<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loisirs de Joas — sport & voyages</title>
<style>
  :root{--bg:#0f1115;--card:#1c2029;--border:#2a2f3a;--text:#e8eaf0;--muted:#9aa1b0;--accent:#6c8eff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px;max-width:640px;margin-left:auto;margin-right:auto}
  h1{color:var(--accent);font-size:22px}
  h3{margin-top:26px;margin-bottom:10px}
  .hint{color:var(--muted);font-size:14px}
  .err{color:#f26d6d}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  input,select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:14px;margin-bottom:10px;font-family:inherit}
  .row2{display:flex;gap:8px}
  .row2>*{flex:1}
  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
  .event-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .event-date{font-size:12px;color:var(--muted);text-transform:capitalize}
  .event-title{font-size:15px;margin-top:2px}
  .event-author{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic}
</style>
</head>
<body>
  <h1>🎉 Loisirs de Joas</h1>
  <p class="hint">Sport, voyages, sorties — propose un truc, on s'organise ensemble.</p>
  <div id="loisirs-root"></div>
  <script type="module" src="loisirs.js"></script>
</body>
</html>
